name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check App Store update version comparisons
        run: node scripts/test-app-update.mjs

      - name: Audit lessons and animation coverage
        run: npm run test:lessons

      - name: Check whole-curriculum study support and retry behavior
        run: npm run test:remediation

      - name: Verify all electromagnetic movies and source coverage
        run: npm run test:em-videos

      - name: Verify every new lesson movie and difficulty level
        run: npm run test:video-scripts && npm run test:all-videos

      - name: Verify reviewed narration and prerequisite playback order
        run: npm run test:reviewed-videos && npm run test:prerequisite-videos && npm run test:em-video-repairs

      - name: Check reviewed pronunciation coverage and video revisions
        run: npm run test:pronunciation

      - name: Check unit-scoped prerequisites and playback positions
        run: npm run test:video-playlists

      - name: Check shared main videos and optional supplement routes
        run: npm run test:video-modes

      - name: Check circular-motion pilot algebra and animation cues
        run: npm run test:circular-pilot && npm run test:video-speed
      - name: Check motion-foundation storyboards and algebra
        run: npm run test:motion-foundations && npm run test:motion-inserts && node scripts/test-uniform-acceleration.mjs && node scripts/test-uniform-continuation.mjs && node scripts/test-freefall-storyboards.mjs && node scripts/test-projectile-foundations.mjs && node scripts/test-projectile-middle.mjs && node scripts/test-addition-theorem.mjs && node scripts/test-projectile-advanced.mjs && node scripts/test-force-storyboards.mjs && node scripts/test-work-foundations.mjs && node scripts/test-work-components.mjs && node scripts/test-potential-energy.mjs && node scripts/test-spring-energy.mjs && node scripts/test-momentum-foundations.mjs && node scripts/test-momentum-middle.mjs && node scripts/test-momentum-advanced.mjs && node scripts/test-radian-foundations.mjs && node scripts/test-circular-foundations.mjs && node scripts/test-shm-foundations.mjs && node scripts/test-shm-middle.mjs && node scripts/test-sine-derivative.mjs && node scripts/test-sine-motion.mjs && node scripts/test-shm-advanced.mjs && node scripts/test-heat-foundations.mjs && node scripts/test-foundation-appendices.mjs && node scripts/test-heat-melting.mjs && node scripts/test-gas-foundations.mjs && node scripts/test-gas-temperature.mjs && node scripts/test-gas-states.mjs && node scripts/test-ideal-gas-foundations.mjs && node scripts/test-mole-foundations.mjs && node scripts/test-gas-particles.mjs && node scripts/test-ideal-gas-advanced.mjs && node scripts/test-gas-work.mjs

      - name: Audit inline math and formula rendering
        run: npm run test:math

      - name: Audit equation images and original storyboards
        run: npm run test:calculations

      - name: Audit offline image handling
        run: node scripts/audit-offline.mjs

      - name: Audit university intro and middle levels
        run: node scripts/audit-university-levels.mjs

      - name: Audit all 29 topics and lossless level relocation
        run: node scripts/audit-university-curriculum.mjs

      - name: Audit chapter-wide learning progression
        run: node scripts/audit-study-flow.mjs

      - name: Check potential and field explanation regressions
        run: node scripts/test-potential-context.mjs

      - name: Audit synchronized electromagnetic lessons
        run: npm run test:guided

      - name: Check all ten teaching principles (regression checks)
        run: npm run test:ten-principles

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # Open tabs can still reference a previous build's hashed equation images.
          keep_files: true
